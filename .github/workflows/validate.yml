name: Validate Translations

on:
  push:
    branches: [main]
    paths:
      - 'locales/**'
  pull_request:
    branches: [main]
    paths:
      - 'locales/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Validate JSON syntax
        run: |
          echo "🔍 Validando sintaxis JSON..."
          for file in locales/*.json; do
            echo "Revisando: $file"
            python -m json.tool "$file" > /dev/null || (echo "❌ Error en $file" && exit 1)
          done
          echo "✅ Todos los JSONs son válidos"

      - name: Check required keys
        run: |
          echo "🔑 Verificando claves requeridas..."
          python3 << 'EOF'
          import json
          import sys
          
          # Claves requeridas en todos los idiomas (esquema v2: alineado con data-i18n en index.html)
          required_keys = [
              "section1.subtitle",
              "section1.cta.discover",
              "section1.cta.reservations",
              "section1.cta.primary",
              "section1.emails.title",
              "section1.emails.direccion",
              "section1.emails.educativa",
              "section1.emails.tecnologica",
              "section1.events.alt",
              "section2.support",
              "section2.realtime",
              "section2.info.line1",
              "section2.info.line2",
              "section2.info.line3",
              "section2.info.line4",
              "section2.access",
              "section2.roles.title",
              "section2.roles.teacher",
              "section2.roles.student",
              "section2.roles.deep",
              "section2.roles.workshops",
              "section3.title.create",
              "section3.title.with",
              "section3.title.us",
              "section3.description",
              "section3.cards.title1",
              "section3.cards.title2",
              "section3.cards.title3",
              "section5.title",
              "section5.description",
              "section5.cards.tools",
              "section5.cards.repository",
              "common.a11y.toggleLanguage",
              "common.a11y.location",
              "common.a11y.openChat",
              "common.a11y.chatbot",
              "section4.projects.title",
              "section4.projects.description",
              "section4.projects.enchufate.menu",
              "section4.projects.enchufate.title",
              "section4.projects.enchufate.text",
              "section4.projects.profe.menu",
              "section4.projects.profe.title",
              "section4.projects.profe.text",
              "section4.projects.osadia.menu",
              "section4.projects.osadia.title",
              "section4.projects.osadia.text",
              "section4.projects.osadia.stickers",
              "section4.projects.cyberbox.menu",
              "section4.projects.cyberbox.title",
              "section4.projects.cyberbox.text",
              "section4.projects.cyberbox.cta",
              "section4.deda.title",
              "section4.deda.description",
              "section4.deda.process.menu",
              "section4.deda.process.title",
              "section4.deda.process.text",
              "section4.deda.course.menu",
              "section4.deda.course.title",
              "section4.deda.course.text",
              "section4.deda.strategies.menu",
              "section4.deda.strategies.title",
              "section4.deda.strategies.text",
              "section4.deda.techniques.menu",
              "section4.deda.techniques.title",
              "section4.deda.techniques.text",
              "section6.tools.title",
              "section6.tools.description",
              "section6.red.title",
              "section6.red.subtitle",
              "section6.red.description",
              "section6.red.presentations",
              "section6.red.videos",
              "footer.stats.resources",
              "footer.stats.courses",
              "footer.stats.students",
              "footer.follow",
              "footer.support"
          ]
          
          def get_nested(obj, path):
              """Obtener valor anidado usando notación de puntos"""
              keys = path.split('.')
              current = obj
              for key in keys:
                  if isinstance(current, dict):
                      current = current.get(key)
                  else:
                      return None
              return current
          
          languages = ['es', 'en', 'fr', 'de']
          errors = []
          
          for lang in languages:
              try:
                  with open(f'locales/{lang}.json', 'r', encoding='utf-8') as f:
                      data = json.load(f)
                  
                  for key in required_keys:
                      value = get_nested(data, key)
                      if value is None or value == "":
                          errors.append(f"❌ {lang}.json: Clave '{key}' falta o está vacía")
                      else:
                          print(f"✅ {lang}.json: '{key}' OK")
              except FileNotFoundError:
                  errors.append(f"❌ locales/{lang}.json no encontrado")
              except json.JSONDecodeError as e:
                  errors.append(f"❌ {lang}.json: Error JSON - {e}")
          
          if errors:
              print("\n🚨 Errores encontrados:")
              for error in errors:
                  print(error)
              sys.exit(1)
          else:
              print("\n✅ Todas las claves requeridas están presentes en todos los idiomas")
          EOF

      - name: Summary
        if: success()
        run: |
          echo "✅ Validación completada exitosamente"
          echo "✅ Todos los JSONs tienen sintaxis válida"
          echo "✅ Todas las claves requeridas están presentes"
